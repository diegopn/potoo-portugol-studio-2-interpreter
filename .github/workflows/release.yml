name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin potoo-portugol-studio-2
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bundle="potoo-portugol-studio-2-interpreter-${version}-${{ matrix.target }}"
          mkdir -p "$bundle"
          cp "target/${{ matrix.target }}/release/potoo-portugol-studio-2" "$bundle/"
          cp LICENSE "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $bundle = "potoo-portugol-studio-2-interpreter-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/potoo-portugol-studio-2.exe" -Destination $bundle
          Copy-Item "LICENSE" -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: potoo-portugol-studio-2-interpreter-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          notes="Patch release $tag for the Portugol Studio 2.0 interpreter and standalone CLI. Native builds for Linux x86_64 GNU, Windows x86_64 MSVC, Intel macOS x86_64, and Apple silicon arm64 macOS. Each archive contains the executable and LICENSE. The parser reports the first lexical or syntax error. The standalone CLI provides standard input/output; graphics, keyboard, mouse, audio, HTTP, project files, and calendar services require a host implementation, and the runner has no interactive debugger. See README.md for support boundaries; verify downloads with SHA256SUMS. GitHub source snapshots are separate from these binary packages."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "Portugol Studio 2.0 interpreter $tag" \
              --verify-tag \
              --notes "$notes"
          fi
